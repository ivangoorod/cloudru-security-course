#cloud-config
# dc01: внутренний DNS (bind9), двухуровневая PKI (Root CA + Issuing CA), CRL/AIA на Apache,
# PostgreSQL для Keycloak и сам Keycloak на HTTPS.
# Адаптация init/kc-install.yml из YandexCloud-Security-Course-KeyCloakVersion под Ubuntu 22.04 и cloud.ru:
# вместо Managed PostgreSQL — локальный PostgreSQL, конфиги OpenSSL вшиты, а не качаются с GitHub.
hostname: ${hostname}
fqdn: ${hostname}.${domain}
prefer_fqdn_over_hostname: true
manage_etc_hosts: true
ssh_pwauth: false
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - "${ssh_key}"
write_files:
  - path: /root/realm.json
    permissions: "0600"
    encoding: b64
    content: ${realm_b64}
  - path: /root/openssl-root.cnf
    permissions: "0644"
    encoding: b64
    content: ${openssl_root_b64}
  - path: /root/openssl-intermediate.cnf
    permissions: "0644"
    encoding: b64
    content: ${openssl_intermediate_b64}
  - path: /root/hosts.zone
    permissions: "0644"
    encoding: b64
    content: ${hosts_zone_b64}
  - path: /root/lab.env
    permissions: "0600"
    content: |
      DOMAIN='${domain}'
      UPSTREAM_DNS='${upstream_dns}'
      KC_VER='${kc_ver}'
      KC_PORT='${kc_port}'
      KC_ADM_USER='${kc_adm_user}'
      KC_ADM_PASS='${kc_adm_pass}'
      PG_DB_NAME='${pg_db_name}'
      PG_DB_USER='${pg_db_user}'
      PG_DB_PASS='${pg_db_pass}'
  - path: /root/guest_prep.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      exec > /var/log/lab-prep.log 2>&1
      set -x
      source /root/lab.env
      export DEBIAN_FRONTEND=noninteractive
      # cloud-init/apt-daily могут ещё держать блокировку apt — ждём её
      echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
      apt_wait() { while fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; do sleep 5; done; }
      APT="apt-get -o DPkg::Lock::Timeout=900"

      FQDN=${hostname}.${domain}
      IP4=${ip}
      DOMAIN_NAME=$(echo $DOMAIN | cut -f1 -d".")
      timedatectl set-timezone Europe/Moscow

      apt_wait; $APT update
      apt_wait; $APT install -y bind9 dnsutils unzip wget curl ca-certificates apache2 openjdk-17-jre-headless postgresql
      command -v named-checkconf || { echo "APT FAILED"; exit 1; }

      # ---------- DNS ----------
      cat > /etc/bind/named.conf.options <<EOF
      options {
              directory "/var/cache/bind";
              forwarders { $UPSTREAM_DNS; };
              allow-query { localhost; ${subnet_cidr}; };
              allow-recursion { localhost; ${subnet_cidr}; };
              dnssec-validation auto;
              listen-on { any; };
              listen-on-v6 { none; };
      };
      EOF

      cat >> /etc/bind/named.conf.local <<EOF
      zone "$DOMAIN" {
        type master;
        file "/etc/bind/db.$DOMAIN";
      };
      EOF

      cat > /etc/bind/db.$DOMAIN <<EOF
      \$TTL    3600
      @       IN      SOA     ns.$DOMAIN. root.$DOMAIN. (
                                    1         ; Serial
                                 3600         ; Refresh
                                  900         ; Retry
                              2419200         ; Expire
                                 3600 )       ; Negative Cache TTL
      @         IN  NS  ns.$DOMAIN.
      @         IN  A   $IP4
      ns        IN  A   $IP4
      keycloak  IN  A   $IP4
      crl       IN  A   $IP4
      EOF
      cat /root/hosts.zone >> /etc/bind/db.$DOMAIN

      named-checkconf && named-checkzone $DOMAIN /etc/bind/db.$DOMAIN
      systemctl restart named
      systemctl is-active named || { echo "BIND FAILED"; exit 1; }

      mkdir -p /etc/systemd/resolved.conf.d
      cat > /etc/systemd/resolved.conf.d/lab.conf <<EOF
      [Resolve]
      DNS=127.0.0.1
      Domains=$DOMAIN
      EOF
      systemctl restart systemd-resolved

      # ---------- PKI: Root CA ----------
      mkdir -p /opt/ca && cd /opt/ca
      mkdir -p certs crl newcerts private
      chmod 700 private
      touch index.txt
      echo 1000 > serial
      echo 20 > crlnumber
      cp /root/openssl-root.cnf /opt/ca/openssl.cnf

      openssl req -new -x509 -newkey rsa:4096 -days 3650 -config openssl.cnf -sha256 -extensions v3_ca -nodes \
          -subj "/C=RU/ST=Moscow/L=Moscow/O=Nezabudka/OU=Lab/CN=LAB CLASS1 Root CA" \
          -keyout /opt/ca/private/ca.key.pem -out /opt/ca/certs/ca.cert.pem

      echo "crlDistributionPoints = URI:http://crl.$DOMAIN/rootca.crl" >> /opt/ca/openssl.cnf
      echo "authorityInfoAccess = caIssuers;URI:http://crl.$DOMAIN/ca.crt" >> /opt/ca/openssl.cnf
      openssl ca -config /opt/ca/openssl.cnf -gencrl -out /opt/ca/crl/rootca.crl.pem

      cp /opt/ca/certs/ca.cert.pem /usr/local/share/ca-certificates/lab-root-ca.crt

      # ---------- PKI: Intermediate (Issuing) CA ----------
      mkdir -p /opt/ca/intermediate && cd /opt/ca/intermediate
      mkdir -p certs crl csr newcerts private
      chmod 700 private
      touch index.txt
      echo 1000 > serial
      echo 1000 > crlnumber
      cp /root/openssl-intermediate.cnf /opt/ca/intermediate/openssl.cnf

      cd /opt/ca
      openssl req -new -newkey rsa:4096 -config /opt/ca/intermediate/openssl.cnf -sha256 -nodes \
          -subj "/C=RU/ST=Moscow/L=Moscow/O=Nezabudka/OU=Lab/CN=LAB Issuing CA" \
          -keyout /opt/ca/intermediate/private/intermediate.key.pem -out /opt/ca/intermediate/csr/intermediate.csr.pem
      chmod 400 /opt/ca/intermediate/private/intermediate.key.pem

      openssl ca -batch -config openssl.cnf -extensions v3_intermediate_ca \
            -days 1825 -notext -md sha256 \
            -in /opt/ca/intermediate/csr/intermediate.csr.pem \
            -out /opt/ca/intermediate/certs/intermediate.cert.pem

      cat /opt/ca/intermediate/certs/intermediate.cert.pem /opt/ca/certs/ca.cert.pem \
            > /opt/ca/intermediate/certs/ca-chain.cert.pem

      echo "crlDistributionPoints = URI:http://crl.$DOMAIN/intermediate.crl" >> /opt/ca/intermediate/openssl.cnf
      echo "authorityInfoAccess = caIssuers;URI:http://crl.$DOMAIN/intermediate.crt" >> /opt/ca/intermediate/openssl.cnf
      openssl ca -config /opt/ca/intermediate/openssl.cnf -gencrl -out /opt/ca/intermediate/crl/intermediate.crl.pem

      cp /opt/ca/intermediate/certs/intermediate.cert.pem /usr/local/share/ca-certificates/lab-issuing-ca.crt
      update-ca-certificates

      # ---------- Apache: публикация CRL и сертификатов CA ----------
      mkdir -p /var/www/crl.$DOMAIN /var/log/apache2/crl.$DOMAIN
      chown root:adm /var/log/apache2/crl.$DOMAIN
      chmod 750 /var/log/apache2/crl.$DOMAIN
      cat > /etc/apache2/sites-available/000-default.conf <<EOF
      <VirtualHost *:80>
              ServerName crl.$DOMAIN
              DocumentRoot /var/www/crl.$DOMAIN
              <Directory /var/www/crl.$DOMAIN/>
                      Options Indexes
                      AllowOverride None
              </Directory>
              LogLevel warn
              ErrorLog /var/log/apache2/crl.$DOMAIN/error.log
              CustomLog /var/log/apache2/crl.$DOMAIN/access.log combined
      </VirtualHost>
      EOF
      cp /opt/ca/intermediate/crl/intermediate.crl.pem /var/www/crl.$DOMAIN/intermediate.crl
      cp /opt/ca/intermediate/certs/intermediate.cert.pem /var/www/crl.$DOMAIN/intermediate.crt
      cp /opt/ca/crl/rootca.crl.pem /var/www/crl.$DOMAIN/rootca.crl
      cp /opt/ca/certs/ca.cert.pem /var/www/crl.$DOMAIN/ca.crt
      cp /opt/ca/intermediate/certs/ca-chain.cert.pem /var/www/crl.$DOMAIN/
      systemctl restart apache2

      # ---------- TLS-сертификат для Keycloak ----------
      openssl req -new -sha256 -newkey rsa:2048 -config /opt/ca/intermediate/openssl.cnf -nodes \
          -subj "/C=RU/ST=Moscow/L=Moscow/O=Nezabudka/OU=Lab/CN=$FQDN" \
          -addext "subjectAltName = DNS:$FQDN, DNS:keycloak.$DOMAIN" \
          -keyout /opt/ca/intermediate/private/$FQDN.key.pem -out /opt/ca/intermediate/csr/$FQDN.csr.pem
      # [ server_cert ] — последняя секция конфига, поэтому SAN дописываем в конец и потом убираем
      echo "subjectAltName = DNS:$FQDN, DNS:keycloak.$DOMAIN" >> /opt/ca/intermediate/openssl.cnf
      openssl ca -batch -config /opt/ca/intermediate/openssl.cnf \
            -extensions server_cert -days 365 -notext -md sha256 \
            -in /opt/ca/intermediate/csr/$FQDN.csr.pem \
            -out /opt/ca/intermediate/certs/$FQDN.cert.pem
      sed -i '$ d' /opt/ca/intermediate/openssl.cnf
      cat /opt/ca/intermediate/certs/$FQDN.cert.pem /opt/ca/intermediate/certs/intermediate.cert.pem \
            > /opt/ca/intermediate/certs/$FQDN.fullchain.pem

      # ---------- PostgreSQL для Keycloak ----------
      sudo -u postgres psql -v ON_ERROR_STOP=1 <<EOF
      CREATE USER $PG_DB_USER WITH PASSWORD '$PG_DB_PASS';
      CREATE DATABASE $PG_DB_NAME OWNER $PG_DB_USER ENCODING 'UTF8';
      EOF

      # ---------- Keycloak ----------
      # This lab emulates secured enterprise environment.
      # NEVER DEPLOY CAs AND IDP IN ONE SERVER!!!
      cd /root
      curl -sfLO https://github.com/keycloak/keycloak/releases/download/$KC_VER/keycloak-$KC_VER.zip
      unzip -q keycloak-$KC_VER.zip
      mkdir -p /opt/keycloak
      cp -R keycloak-$KC_VER/* /opt/keycloak
      rm -rf keycloak-$KC_VER keycloak-$KC_VER.zip /opt/keycloak/bin/*.bat

      cp /opt/ca/intermediate/certs/$FQDN.fullchain.pem /opt/keycloak/conf/server.crt.pem
      cp /opt/ca/intermediate/private/$FQDN.key.pem /opt/keycloak/conf/server.key.pem

      cat > /opt/keycloak/conf/keycloak.conf <<EOF
      db=postgres
      db-url-host=localhost
      db-url-database=$PG_DB_NAME
      db-username=$PG_DB_USER
      db-password=$PG_DB_PASS
      hostname=$FQDN
      hostname-strict=true
      http-enabled=false
      https-port=$KC_PORT
      https-protocols=TLSv1.3,TLSv1.2
      https-certificate-file=/opt/keycloak/conf/server.crt.pem
      https-certificate-key-file=/opt/keycloak/conf/server.key.pem
      log-level=INFO
      EOF

      groupadd -r keycloak
      useradd -r -g keycloak -d /opt/keycloak -s /sbin/nologin keycloak
      chown -R keycloak:keycloak /opt/keycloak
      chmod 600 /opt/keycloak/conf/keycloak.conf /opt/keycloak/conf/server.key.pem

      sudo -u keycloak /opt/keycloak/bin/kc.sh build
      install -o keycloak -g keycloak -m 600 /root/realm.json /opt/keycloak/realm.json
      sudo -u keycloak /opt/keycloak/bin/kc.sh import --file=/opt/keycloak/realm.json
      rm -f /opt/keycloak/realm.json

      cat > /etc/keycloak.env <<EOF
      KEYCLOAK_ADMIN=$KC_ADM_USER
      KEYCLOAK_ADMIN_PASSWORD=$KC_ADM_PASS
      EOF
      chmod 600 /etc/keycloak.env

      cat > /etc/systemd/system/keycloak.service <<EOF
      [Unit]
      Description=Keycloak Service
      After=network.target postgresql.service

      [Service]
      User=keycloak
      Group=keycloak
      WorkingDirectory=/opt/keycloak
      EnvironmentFile=/etc/keycloak.env
      ExecStart=/opt/keycloak/bin/kc.sh start
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
      EOF

      systemctl daemon-reload
      systemctl enable --now keycloak

      for i in $(seq 1 60); do
        curl -sf "https://$FQDN:$KC_PORT/realms/master" -o /dev/null && break
        sleep 10
      done
      rm -f /root/lab.env
      echo "LAB PREP DONE"
runcmd:
  - [bash, /root/guest_prep.sh]
